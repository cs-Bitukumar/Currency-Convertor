<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Codes</title>
  <link rel="icon" type="image/x-icon" href="assets/logo.png">
  <link rel="stylesheet" href="style2.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
  <div class="moving-link-bar" aria-label="Portfolio link">
    <a class="moving-link" href="https://bitukumar.vercel.app" target="_blank" rel="noopener noreferrer">
      Visit my portfolio to know more about my work →
    </a>
  </div>

  <main class="container">
    <div class="logo"><img src="assets/logo.png" alt="Currency Converter logo" height="50" width="50"><h1>Currency Codes</h1></div>
    <form>
      <div class="amount"><p>Enter Number</p><input type="number" value="100" min="0" step="any" aria-label="Amount"></div>
      <div class="drop-down">
        <div class="select-container"><div class="from"><p>From</p><div class="bitu"><img src="https://flagsapi.com/US/flat/64.png" alt="From currency flag"><select name="from" id="from" aria-label="From currency"></select></div></div></div>
        <i class="fa-solid fa-arrow-right-arrow-left" aria-hidden="true"></i>
        <div class="select-container"><div class="to"><p>To</p><div class="bitu"><img src="https://flagsapi.com/IN/flat/64.png" alt="To currency flag"><select name="to" id="to" aria-label="To currency"></select></div></div></div>
      </div>
      <div class="msg" aria-live="polite">Loading rate...</div>
      <button type="submit">Get Exchange Rate</button>
      <p><a href="index.html">Back to Currency Converter</a></p>
    </form>
  </main>
  <script src="currToCountrymap.js"></script>
</body>
</html>
